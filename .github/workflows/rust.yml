name: Rust

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Test, lint, docs, and package
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run tests
        run: cargo test --workspace --all-features --locked
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps --locked
      - name: Compile benchmarks
        run: cargo bench -p eurydice_engine --no-run --locked
      - name: Verify release package
        run: cargo package -p eurydice_engine --locked

  msrv:
    name: Rust 1.90 MSRV
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.90
        run: rustup toolchain install 1.90.0 --profile minimal
      - name: Check engine on MSRV
        run: cargo +1.90.0 check -p eurydice_engine --lib --all-features --locked
