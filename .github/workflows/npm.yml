name: npm

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: eurydice_www/package-lock.json
    - name: Install dependencies
      run: npm ci
      working-directory: eurydice_www
    - name: Check formatting
      run: npm run format:check
      working-directory: eurydice_www
    - name: Check types
      run: npm run typecheck
      working-directory: eurydice_www
    - name: Run tests
      run: npm test
      working-directory: eurydice_www