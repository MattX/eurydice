[package]
name = "eurydice_engine"
version = "0.1.0"
edition = "2024"

[lib]
name = "eurydice_engine"
path = "src/lib.rs"

[[bench]]
name = "benchmark"
harness = false

[lints.clippy]
cast_possible_wrap = "warn"
cast_possible_truncation = "warn"
cast_precision_loss = "warn"
cast_sign_loss = "warn"

[dependencies]
# Used to report errors nicely.
miette = "7.2.0"
thiserror = "2.0.12"

# Serde derive is used for testing only, but we need it here to derive
# the traits.
serde = { version = "1.0.204", features = ["derive", "rc"] }

# Parser stuff
lalrpop-util = { version = "0.22.2", features = ["lexer", "unicode"] }

# Used for bigints
malachite = "0.6.0"

# Random utility stuff
lazy_static = "1.5.0"

[build-dependencies]
lalrpop = "0.22.2"

[dev-dependencies]
approx = "0.5.1"
csv = "1.3.0"
pretty_assertions = "1.4.0"
serde-lexpr = "0.1.3"

# Criterion is split by target so the bench can run under wasm as well as
# natively. Its default features include `rayon`, which needs threads that
# wasm32 does not have; it must be off for wasm and there is no reason to give
# it up natively. Cargo unifies features across dependency tables, so criterion
# cannot also appear in the plain `[dev-dependencies]` block above — listing it
# there would switch `rayon` back on for every target.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
criterion = { version = "0.6.0", features = ["html_reports"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
criterion = { version = "0.6.0", default-features = false, features = [
    "cargo_bench_support",
    "plotters",
    "html_reports",
] }
