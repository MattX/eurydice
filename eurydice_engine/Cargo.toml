[package]
name = "eurydice_engine"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "Dice probability engine implementing the AnyDice language, using the Icepool algorithm"
repository = "https://github.com/MattX/eurydice"
homepage = "https://eurydice.terbium.io"
documentation = "https://docs.rs/eurydice_engine"
license = "Apache-2.0"
readme = "README.md"
keywords = ["dice", "probability", "anydice", "rpg", "tabletop"]
categories = ["game-development", "mathematics", "parser-implementations"]

[lib]
name = "eurydice_engine"
path = "src/lib.rs"

[[bench]]
name = "benchmark"
harness = false

[lints.clippy]
cast_possible_wrap = "warn"
cast_possible_truncation = "warn"
cast_precision_loss = "warn"
cast_sign_loss = "warn"

[features]
default = ["serde"]
# Derives `Serialize` on the public types. On by default: the wasm frontend
# serializes a whole `RunReport`, and it is what most callers want. Turn it off
# with `default-features = false` to keep serde out of the dependency graph.
serde = ["dep:serde"]

[dependencies]
serde = { version = "1.0.204", features = ["derive"], optional = true }

# Parser stuff
lalrpop-util = { version = "0.22.2", features = ["lexer", "unicode"] }

# Used for bigints.
#
# `floats` is not a default feature, but malachite's `std` feature enables
# `malachite-float/std` without a `?`, which drags the float crate in anyway.
# Depending on the three sub-crates directly turns `std` back on for the parts
# we do use; without that malachite-base falls back to `libm` and the wasm
# binary grows by ~43kB.
malachite = { version = "0.10.0", default-features = false, features = [
    "naturals_and_integers",
    "rationals",
] }
malachite-base = { version = "0.10.0", features = ["std"] }
malachite-nz = { version = "0.10.0", features = ["std"] }
malachite-q = { version = "0.10.0", features = ["std"] }

[build-dependencies]
lalrpop = "0.22.2"

[dev-dependencies]
approx = "0.5.1"
csv = "1.3.0"
pretty_assertions = "1.4.0"
serde-lexpr = "0.1.3"
thiserror = "2.0.12"

# Criterion is split by target so the bench can run under wasm as well as
# natively. Its default features include `rayon`, which needs threads that
# wasm32 does not have; it must be off for wasm and there is no reason to give
# it up natively. Cargo unifies features across dependency tables, so criterion
# cannot also appear in the plain `[dev-dependencies]` block above — listing it
# there would switch `rayon` back on for every target.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
criterion = { version = "0.6.0", features = ["html_reports"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
criterion = { version = "0.6.0", default-features = false, features = [
    "cargo_bench_support",
    "plotters",
    "html_reports",
] }
